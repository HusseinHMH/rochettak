function renderCalendar(){let base=new Date(2026,10,12);let start=new Date(base);if(calendarMode==="Month")start=new Date(2026,10+calendarOffset,1);else if(calendarMode==="Week")start.setDate(base.getDate()+calendarOffset*7-(base.getDay()));else if(calendarMode==="Day")start.setDate(base.getDate()+calendarOffset);else start.setDate(base.getDate()+calendarOffset*7);let year=start.getFullYear(),month=start.getMonth(),days=new Date(year,month+1,0).getDate();let content="";if(calendarMode==="Month"){let firstDay=new Date(year,month,1).getDay(),cells=[];for(let i=0;i<firstDay;i++)cells.push('<div class="calday mutedday"></div>');for(let d=1;d<=days;d++){let idx=(d*17)%appts.length,sample=appts.slice(idx,idx+((d%3)+1));cells.push('<div class="calday '+(d===12&&month===10?"today":"")+'"><b>'+d+'</b>'+sample.slice(0,2).map((a,j)=>'<span class="event '+(j?"teal":"")+'">'+a.time+' '+esc(a.patient.name.split(" ")[0])+'</span>').join("")+(d%5===0?'<span class="event gold">Lab · '+(d%7+2)+' samples</span>':"")+'</div>')}content='<div class="calendar">'+["SUN","MON","TUE","WED","THU","FRI","SAT"].map(x=>'<div class="calhead">'+x+'</div>').join("")+cells.join("")+'</div>'}else if(calendarMode==="Day"||calendarMode==="Week"){let count=calendarMode==="Day"?1:7;let daysHtml=[];for(let i=0;i<count;i++){let day=new Date(start);day.setDate(start.getDate()+i);let dayNo=day.getDate(),items=appts.filter(a=>a.date.getDate()===dayNo).slice(0,calendarMode==="Day"?22:7);daysHtml.push('<div class="panel" style="margin-bottom:10px"><div class="panelhead"><h2>'+day.toLocaleDateString(lang==="ar"?"ar-EG":"en-GB",{weekday:"long",day:"numeric",month:"short"})+'</h2><span class="tag">'+items.length+' displayed events</span></div><div class="list">'+(items.length?items.map(a=>'<div class="listrow"><div><strong>'+a.time+' · '+esc(a.patient.name)+'</strong><small>'+esc(a.doctor.name)+' · '+esc(a.doctor.department)+' · '+a.type+'</small></div>'+badge(a.status)+'</div>').join(""):'<div class="empty">No scheduled events in this sample slice.</div>')+'</div></div>')}content=daysHtml.join("")}else{let items=appts.slice(0,40);content=table(["DATE","TIME","PATIENT","DOCTOR","DEPARTMENT","VISIT TYPE","STATUS"],items.map(a=>'<tr><td>'+a.date.toLocaleDateString("en-GB")+'</td><td>'+a.time+'</td><td>'+a.patient.name+'</td><td>'+a.doctor.name+'</td><td>'+a.doctor.department+'</td><td>'+a.type+'</td><td>'+badge(a.status)+'</td></tr>').join(""))}return head("calendar",btn("＋ Add event","new-appointment",""))+'<div class="panel"><div class="panelhead"><div><h2>'+start.toLocaleDateString(lang==="ar"?"ar-EG":"en-GB",{month:"long",year:"numeric"})+'</h2><small class="muted">Clinic, doctors, rooms, labs and radiology</small></div><div class="actions"><button class="btn ghost small" data-act="cal-prev">←</button><button class="btn ghost small" data-act="cal-today">Today</button><button class="btn ghost small" data-act="cal-next">→</button></div></div><div class="tabs">'+["Day","Week","Month","Agenda"].map(x=>'<button class="tab '+(calendarMode===x?"active":"")+'" data-calmode="'+x+'">'+x+'</button>').join("")+'</div><div class="toolbar"><select class="field"><option>All departments</option>'+depts.map(d=>'<option>'+d[0]+'</option>').join("")+'</select><select class="field"><option>All resources</option><option>Doctors</option><option>Clinics</option><option>Operating rooms</option><option>Laboratory</option><option>Radiology</option></select><select class="field"><option>All statuses</option><option>Confirmed</option><option>Pending</option><option>Completed</option></select></div>'+content+'<div class="notice">Calendar data is synthetic. Day, week, month and agenda layouts are interactive views over the demo schedule. Live conflict detection and external calendar sync are not connected.</div></div>'}

if(a==="voice-sample"){if($("noteInput"))$("noteInput").value="Sample dictated note: Patient attended a routine follow-up visit. Clinician reviewed the available records and documented the patient's questions. Follow-up appointment requested.";return}
if(a==="structure-note"){let raw=$("noteInput")?.value||"";if(!raw.trim()){toast("Enter clinician notes first.");return}$("noteOutput").value="VISIT SUMMARY — DRAFT\\nReason / context: "+raw.slice(0,220)+"\\n\\nDOCUMENTED INFORMATION\\n• Source text retained for clinician review\\n• Follow-up items require confirmation\\n• No diagnosis or treatment recommendation generated\\n\\nSTATUS: Draft — clinician approval required.";return}
if(a==="ask-ai"){let q=$("aiQuestion")?.value||"";$("aiAnswer").classList.remove("hidden");$("aiAnswer").textContent="Workflow guide: "+(q.toLowerCase().includes("ocr")?"Upload the document, select its type, review extracted fields and approve the record.":"Open the relevant module, select the patient or record, complete the required fields and submit for authorized review.")+" This is a scripted prototype response.";return}
if(a==="export-report")toast("Demo report export is not connected yet.");
if(a==="generic")toast("This control is represented as a prototype workflow.");
}
$("navMount").addEventListener("click",e=>{let b=e.target.closest("[data-view]");if(b){view=b.dataset.view;searchTerm="";render();$("sidebar").classList.remove("open")}});
$("roleSelect").addEventListener("change",e=>{role=e.target.value;view=groups[role][0][1][0];render();toast("Workspace switched.")});
$("langBtn").addEventListener("click",()=>{lang=lang==="en"?"ar":"en";document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";$("langBtn").textContent=lang==="ar"?"English":"العربية";render();toast(lang==="ar"?"تم تغيير اللغة":"Language switched")});
$("menuToggle").addEventListener("click",()=>$("sidebar").classList.toggle("open"));
$("modalX").addEventListener("click",closeModal);$("modalback").addEventListener("click",e=>{if(e.target===$("modalback"))closeModal()});
$("view").addEventListener("click",e=>{let b=e.target.closest("[data-act]");if(b)action(b.dataset.act,b);let v=e.target.closest("[data-view]");if(v){view=v.dataset.view;render()}let c=e.target.closest("[data-calmode]");if(c){calendarMode=c.dataset.calmode;render()}let p=e.target.closest("[data-prompt]");if(p){$("aiQuestion").value=p.dataset.prompt;action("ask-ai") }});
$("view").addEventListener("change",e=>{if(e.target.id==="docFile")$("fileName").textContent=e.target.files[0]?.name||"No file selected";if(e.target.id==="cityFilter"){let city=e.target.value;searchTerm=city;render()}});
$("view").addEventListener("input",e=>{if(e.target.id==="searchInput"){searchTerm=e.target.value;let pos=e.target.selectionStart;render();let n=$("searchInput");if(n){n.focus();n.setSelectionRange(pos,pos)}}if(e.target.id==="testSearch"||e.target.id==="testCategory"){let q=$("testSearch").value.toLowerCase(),cat=$("testCategory").value;let arr=tests.filter(x=>(x[0]+" "+x[1]).toLowerCase().includes(q)&&(!cat||x[1]===cat));$("testTable").innerHTML=table(["TEST","CATEGORY","SPECIMEN","TURNAROUND","SAMPLE PRICE",""],arr.map((x,i)=>'<tr><td><b>'+x[0]+'</b></td><td>'+x[1]+'</td><td>'+x[2]+'</td><td>'+x[3]+'</td><td>EGP '+x[4]+'</td><td><button class="btn small secondary" data-act="new-lab">Order test</button></td></tr>').join(""))}});
$("view").addEventListener("click",e=>{if(e.target.dataset.act==="cal-prev"){calendarOffset--;render()}if(e.target.dataset.act==="cal-next"){calendarOffset++;render()}if(e.target.dataset.act==="cal-today"){calendarOffset=0;render()}});
render();
})();
</script></body></html>
